# 복습 페이지를 GitHub Pages 로 올린다.
#
# 만들어진 HTML(678 KB)은 저장소에 커밋하지 않는다. 매일 바뀌는 파일이라
# 커밋하면 히스토리가 그만큼 불어난다. 여기서 만들어서 바로 배포한다.
name: 복습 페이지 배포

on:
  push:
    branches: [main]
    paths:
      - "hanwha-agent/concepts/**"
      - "hanwha-agent/review/카드.md"
      - "hanwha-agent/review/만들기.py"
      - ".github/workflows/review-pages.yml"
  workflow_dispatch:        # 액션 탭에서 손으로도 돌릴 수 있다

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 나중 것만 남긴다. 진행 중인 것은 끊지 않는다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성
        run: python -m pip install --quiet "markdown-it-py>=3" "pillow>=10"

      - name: 만들기
        working-directory: hanwha-agent
        run: python review/만들기.py --pages

      - uses: actions/upload-pages-artifact@v3
        with:
          path: hanwha-agent/review/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
